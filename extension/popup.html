<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    width: 240px; margin: 0; padding: 14px 16px;
    font: 13px "Segoe UI", system-ui, sans-serif;
    background: #131316; color: #e8e8ea;
  }
  h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 18px; height: 18px; }
  .row { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a3a44; flex: 0 0 auto; }
  .dot.ok { background: #4ba36a; }
  .dot.bad { background: #e05555; }
  .hint { color: #9a9aa5; font-size: 12px; line-height: 1.5; }
  button {
    width: 100%; margin-top: 10px; padding: 7px; border-radius: 7px;
    border: 1px solid #2a2a32; background: #1b1b20; color: #e8e8ea; cursor: pointer;
  }
  button:hover { border-color: #3a3a44; }
</style>
</head>
<body>
  <h1><img src="icons/icon32.png" alt="" /> Hanzla-GPT</h1>
  <div class="row"><span class="dot" id="dot"></span><span id="status">Checking…</span></div>
  <div class="hint" id="hint"></div>
  <button id="retry">Reconnect</button>
  <script src="popup.js"></script>
</body>
</html>
